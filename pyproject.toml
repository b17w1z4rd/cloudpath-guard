[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudpath-guard"
version = "0.1.0"
description = "AWS EC2 and IAM exposure correlation with offline evidence and scan drift"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.34,<2"]

[project.scripts]
cloudpath-guard = "cloudpath_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
